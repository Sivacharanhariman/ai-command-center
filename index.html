<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Command Center</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app-container">

        <header class="app-header">
            <div>
                <p class="eyebrow">FRONTEND PROTOTYPE</p>
                <h1>AI Command Center</h1>
                <p class="subtitle">
                    Send a question or instruction to your future AI system.
                </p>
            </div>

            <div class="status-badge">
                <span class="status-dot"></span>
                Frontend Online
            </div>
        </header>


        <section class="command-panel">

            <label for="user-input">Your Command</label>

            <textarea
                id="user-input"
                placeholder="Ask something..."
                maxlength="1000"
            ></textarea>

            <div class="input-footer">

                <p id="character-count">
                    0 / 1000
                </p>

                <div class="button-group">

                    <button
                        id="clear-button"
                        class="secondary-button"
                        type="button"
                    >
                        Clear
                    </button>

                    <button
                        id="send-button"
                        class="primary-button"
                        type="button"
                    >
                        Send Command
                    </button>

                </div>

            </div>

        </section>


        <section class="response-panel">

            <div class="response-header">

                <div>
                    <p class="eyebrow">SYSTEM RESPONSE</p>
                    <h2>Response</h2>
                </div>

                <span id="response-status">
                    Ready
                </span>

            </div>

            <div
                id="response-text"
                class="response-content"
            >
                Waiting for your command...
            </div>

        </section>


        <footer class="system-footer">

            <div>
                <span>Frontend</span>
                <strong class="online">
                    ONLINE
                </strong>
            </div>

            <div>
                <span>Backend</span>
                <strong class="offline">
                    NOT CONNECTED
                </strong>
            </div>

            <div>
                <span>AI Model</span>
                <strong class="offline">
                    NOT CONNECTED
                </strong>
            </div>

        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
