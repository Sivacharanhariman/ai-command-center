<!DOCTYPE html>
<html lang ="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>AI Command Center</title>

        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main>
            <h1>AI Command Center</h1>

            <p>Frontend Prototype</p>
            <p>Ask the system a question or give it an Instruction.</p>

            <label for="user-input">Your message</label>

            <textarea id="user-input" placeholder="Type something here..."></textarea>

            <button id="send-button">Send</button>
            <button id="clear-button">Clear</button>

            <section id="response-section">

                <h2>Response</h2>

                <p id="response-text">Waiting for your command...</p>

            </section>

            <section id="backend-section">

                <p>System Status: offline</p>
            </section>

        </main>

        <script src="script.js"></script>

    </body>
</html>
